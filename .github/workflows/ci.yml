name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
        react: [18, 19]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.react == 18
        run: pnpm --filter @voxylo/react add -D react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:packages
